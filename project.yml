name: TVBrowser
options:
  bundleIdPrefix: com.local.tvbrowser
  deploymentTarget:
    tvOS: "15.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "3"
    ENABLE_STRICT_OBJC_MSGSEND: "YES"
targets:
  TVBrowser:
    type: application
    platform: tvOS
    sources:
      - path: TVBrowser
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.local.tvbrowser.app
        INFOPLIST_FILE: TVBrowser/Info.plist
        SWIFT_OBJC_BRIDGING_HEADER: TVBrowser/Bridging-Header.h
        ASSETCATALOG_COMPILER_APPICON_NAME: "App Icon & Top Shelf Image"
        CODE_SIGN_STYLE: Automatic
    dependencies:
      - sdk: GameController.framework
      - sdk: Network.framework
      - sdk: Security.framework
      - sdk: CoreImage.framework
      - sdk: UIKit.framework
      - sdk: Foundation.framework
